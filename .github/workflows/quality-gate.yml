name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Format, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format clang-tidy cmake ninja-build shellcheck libspdlog-dev

      - name: Install Python dependencies
        if: ${{ hashFiles('sources/ml/pyproject.toml') != '' }}
        run: python -m pip install --editable 'sources/ml[dev]'

      - name: Install frontend dependencies
        if: ${{ hashFiles('sources/dashboard/package-lock.json') != '' }}
        run: npm --prefix sources/dashboard ci

      - name: Run quality gate
        run: scripts/verify.sh
