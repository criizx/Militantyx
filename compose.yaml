services:
  dpi-core:
    build:
      context: .
      dockerfile: sources/core/Dockerfile
    image: militantyx-core:local
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      LOG_LEVEL: info
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
    volumes:
      - ./sources/pcaps:/app/pcaps:ro

  clickhouse:
    image: clickhouse/clickhouse-server:lts
    environment:
      CLICKHOUSE_DB: militantyx
      CLICKHOUSE_USER: militantyx
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-militantyx}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse_data:
